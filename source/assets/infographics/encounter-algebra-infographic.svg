<text x="470" y="824" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50636D">Alternatives remain available</text>
<text x="818" y="1029" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#C08820">Missing bridge: prove it, don’t skip it.</text>
<text x="110" y="1085" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#182D39">MECE cuts partition the obligations. Dependencies connect across the cuts.</text>
<text x="70" y="1164" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#50636D">Shortest plausible typed route — including every missing edge. A candidate path, not a proof of completion.</text>
<rect x="70" y="1222" width="46" height="46" rx="23" fill="#182D39" stroke="none"/>
<text x="93" y="1254" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFEFA">3</text>
<text x="136" y="1256" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="650" fill="#182D39">Two algebras, one accountable system</text>
<text x="136" y="1299" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#50636D">Values and actions are distinct; both carry structure that can be inspected.</text>
<rect x="70" y="1330" width="810" height="305" rx="18" fill="#E3EFEB" stroke="none"/>
<rect x="910" y="1330" width="820" height="305" rx="18" fill="#EDE7F3" stroke="none"/>
<text x="100" y="1374" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#086C68">PURE ALGEBRA</text>
<text x="940" y="1374" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#674B89">PROCESS ALGEBRA</text>
<text x="100" y="1427" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" fill="#182D39">Calculate a value</text>
<text x="940" y="1427" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" fill="#182D39">Compose a course of action</text>
<text x="100" y="1472" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#50636D">Inputs + rules → result</text>
<text x="100" y="1511" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#50636D">Bind, compare, select, fold, combine.</text>
<text x="100" y="1550" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#50636D">No external effects.</text>
<text x="940" y="1472" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#50636D">Bind → assert → branch → call → explicit port</text>
<text x="940" y="1511" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#50636D">A process may be entirely pure.</text>
<text x="940" y="1550" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#50636D">Effects require a granted native boundary.</text>
<text x="100" y="1600" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#086C68">Concrete kernel: 15 expression primitives.</text>
<text x="940" y="1600" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#674B89">Concrete kernel: 8 process statements.</text>
<rect x="70" y="1696" width="46" height="46" rx="23" fill="#182D39" stroke="none"/>
<text x="93" y="1728" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFEFA">4</text>
<text x="136" y="1730" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="650" fill="#182D39">Lower the meaning — three examples</text>
<text x="136" y="1773" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#50636D">Readable notation below explains the rules; it does not settle Encounter’s future syntax.</text>
<rect x="70" y="1805" width="540" height="620" rx="18" fill="#FFFEFA" stroke="#CBD3CF"/>
<rect x="630" y="1805" width="540" height="620" rx="18" fill="#FFFEFA" stroke="#CBD3CF"/>
<rect x="1190" y="1805" width="540" height="620" rx="18" fill="#FFFEFA" stroke="#CBD3CF"/>
<text x="100" y="1847" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#086C68">A / EXECUTABLE OPERATOR</text>
<text x="100" y="1895" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#182D39">A collection operation</text>
<text x="100" y="1940" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#50636D">“Add one to each number.”</text>
<text x="100" y="1974" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#50636D">Assume numeric array inputs.</text>
<rect x="94" y="2003" width="492" height="64" rx="18" fill="#E3EFEB" stroke="none"/>
<text x="110" y="2042" font-family="Consolas,monospace" font-size="24" font-weight="400" fill="#182D39">map(xs, x, add(x, 1))</text>
<text x="110" y="2101" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#086C68">↓ derived from smaller operators</text>
<text x="110" y="2150" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#182D39">if isArray(xs)</text>
<text x="110" y="2184" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#182D39">  fold(xs, x, acc, [],</text>
<text x="110" y="2218" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#182D39">    append(acc, [add(x, 1)]))</text>
<text x="110" y="2252" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#182D39">else raise(arrayError)</text>
<text x="100" y="2333" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">The fold carries the result.</text>
<text x="100" y="2366" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">The existing guard checks array shape.</text>
<text x="660" y="1847" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#086C68">B / EXECUTABLE FACT QUERY</text>
<text x="660" y="1895" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#182D39">A story title</text>
<text x="660" y="1940" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">REL fact: subject / predicate / object</text>
<text x="660" y="1982" font-family="Consolas,monospace" font-size="21" font-weight="400" fill="#182D39">TheStory / S.Title / "What happened"</text>
<rect x="654" y="2003" width="492" height="64" rx="18" fill="#E3EFEB" stroke="none"/>
<text x="670" y="2042" font-family="Consolas,monospace" font-size="23" font-weight="400" fill="#182D39">one("TheStory", "S.Title")</text>
<text x="670" y="2101" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#086C68">↓ index lookup + cardinality rule</text>
<text x="670" y="2150" font-family="Consolas,monospace" font-size="22" font-weight="400" fill="#182D39">vs = objects(subject, predicate)</text>
<text x="670" y="2184" font-family="Consolas,monospace" font-size="22" font-weight="400" fill="#182D39">if count(vs) = 1</text>
<text x="670" y="2218" font-family="Consolas,monospace" font-size="22" font-weight="400" fill="#182D39">  at(vs, 0)</text>
<text x="670" y="2252" font-family="Consolas,monospace" font-size="22" font-weight="400" fill="#182D39">else raise(cardinalityError)</text>
<text x="660" y="2333" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">Result: “What happened”</text>
<text x="660" y="2366" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">Zero or several matches: refuse.</text>
<text x="1220" y="1847" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#674B89">C / DESIGN TARGET</text>
<text x="1220" y="1895" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#182D39">A typed change</text>
<text x="1220" y="1940" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#50636D">“Add one required field.”</text>
<text x="1220" y="1974" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#50636D">Supply a policy for existing data.</text>
<rect x="1214" y="2003" width="492" height="64" rx="18" fill="#EDE7F3" stroke="none"/>
<text x="1230" y="2042" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#674B89">One admissible semantic action</text>
<text x="1230" y="2101" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#674B89">↓ declared process + authorized port</text>
<text x="1230" y="2150" font-family="Consolas,monospace" font-size="21" font-weight="400" fill="#182D39">validate field + resolution policy</text>
<text x="1230" y="2184" font-family="Consolas,monospace" font-size="21" font-weight="400" fill="#182D39">check affected data + dependants</text>
<text x="1230" y="2218" font-family="Consolas,monospace" font-size="21" font-weight="400" fill="#182D39">form and admit candidate state</text>
<text x="1230" y="2252" font-family="Consolas,monospace" font-size="21" font-weight="400" fill="#182D39">commit atomically; record witness</text>
<text x="1220" y="2333" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">Unresolved obligations: refuse.</text>
<text x="1220" y="2366" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">Current valid state remains intact.</text>
<rect x="70" y="2470" width="1660" height="175" rx="18" fill="#182D39" stroke="none"/>
<text x="100" y="2512" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#A8DAD0">THE RETURN PATH MATTERS</text>
<text x="100" y="2557" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFEFA">Output → rule → source → reason. Lowering preserves declared meaning and names any loss.</text>
<text x="100" y="2597" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFEFA">Semantic decompilation proposes that meaning; lowering implements it. They are different operations.</text>
<text x="70" y="2690" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50636D">Grounded in Claimipedia’s Lightning Decomposition v2, the corpus Lightning Path definition, and Encounter’s kernel.</text>
<text x="70" y="2720" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50636D">A–B: existing mechanisms. C and the full authoring endpoint: design targets. Types do not confer permission.</text>
</svg>