<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2740" viewBox="0 0 1800 2740"><title>From intent to an executable world</title><desc>Semantic decomposition preserves the whole. The lightning principle finds an admissible path with every missing edge visible. Pure algebra calculates values; process algebra composes steps and explicit effects. Three examples show map to fold, a title lookup to an indexed REL query, and a proposed typed edit process.</desc>
<rect x="0" y="0" width="1800" height="2740" rx="0" fill="#F5F3EC" stroke="none"/>
<rect x="0" y="0" width="1800" height="16" rx="0" fill="#086C68" stroke="none"/>
<text x="70" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#086C68">ENCOUNTER / A MAP OF THE ARCHITECTURE</text>
<text x="65" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="650" fill="#182D39">From intent to an executable world</text>
<text x="70" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="400" fill="#50636D">Keep the meaning. Expose the path. Make every step answerable.</text>
<rect x="70" y="271" width="46" height="46" rx="23" fill="#182D39" stroke="none"/>
<text x="93" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFEFA">1</text>
<text x="136" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="650" fill="#182D39">Open the whole</text>
<text x="136" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#50636D">Semantic decomposition — an intelligible entry point, with the wider purpose still attached.</text>
<rect x="70" y="380" width="560" height="242" rx="18" fill="#182D39" stroke="none"/>
<text x="100" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#A8DAD0">INTENT · PARAPHRASED</text>
<text x="100" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="500" fill="#FFFEFA">“Let me build and change an app,</text>
<text x="100" y="518" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="500" fill="#FFFEFA">one valid action at a time.”</text>
<text x="100" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#C8DCD8">Reason → target → goal stays attached.</text>
