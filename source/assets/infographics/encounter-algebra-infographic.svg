<text x="1340" y="515" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#674B89">Evidence</text>
<rect x="1471" y="480" width="222" height="54" rx="18" fill="#EDE7F3" stroke="none"/>
<text x="1582" y="515" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#674B89">Continuity</text>
<text x="750" y="592" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#50636D">LLM proposals: inspect, challenge, correct. Meaning is not admitted by fluency.</text>
<text x="70" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#086C68">Strike → Bound → Differentiate → Relate → Project → Test → Recompose → Correct</text>
<rect x="70" y="681" width="46" height="46" rx="23" fill="#182D39" stroke="none"/>
<text x="93" y="713" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFEFA">2</text>
<text x="136" y="715" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="650" fill="#182D39">Find a lightning path</text>
<text x="136" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#50636D">Work backwards from the goal and forwards from what is actually available.</text>
<rect x="70" y="790" width="1660" height="328" rx="18" fill="#FFFEFA" stroke="#CBD3CF"/>
<rect x="110" y="871" width="280" height="125" rx="18" fill="#E3EFEB" stroke="none"/>
<text x="130" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#086C68">HERE</text>
<text x="130" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">Declared kernel +</text>
<text x="130" y="974" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">authoring basis</text>
<rect x="485" y="871" width="300" height="125" rx="18" fill="#F5F3EC" stroke="none"/>
<text x="505" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#086C68">NEEDED CAPABILITY</text>
<text x="505" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">Construct typed</text>
<text x="505" y="974" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">definitions</text>
<rect x="895" y="871" width="330" height="125" rx="18" fill="#F5F3EC" stroke="none"/>
<text x="915" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#086C68">NEEDED CAPABILITY</text>
<text x="915" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">Compose behaviour</text>
<text x="915" y="974" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">and projections</text>
<rect x="1340" y="871" width="345" height="125" rx="18" fill="#EDE7F3" stroke="none"/>
<text x="1360" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#674B89">END</text>
<text x="1360" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">Build app + extend</text>
<text x="1360" y="974" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#182D39">its authoring tools</text>
