name: Publish Worldwright
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORLDWRIGHT_ENCOUNTER_LIBRARY: ${{ github.workspace }}/.encounter-platform/applications/encounter-libraries/worldwright-source.cjs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out the pinned Encounter compiler
        uses: actions/checkout@v5
        with:
          repository: aaron-alderman/encounter-platform
          ref: d0dbabcf375754a1a4920c564ee5face2a2d2e42
          path: .encounter-platform
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the hub and reusable worlds
        run: npm run build
      - name: Verify feature closure, standalone creation and full behavior
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
